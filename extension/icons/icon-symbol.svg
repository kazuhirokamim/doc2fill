<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" fill="none">
  <defs>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0052FF" />
      <stop offset="100%" stop-color="#00D2FF" />
    </linearGradient>
    <linearGradient id="paperGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.03" />
    </linearGradient>
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Document Outline with Folded Corner -->
  <path d="M26 18C26 14.6863 28.6863 12 32 12H58L74 28V82C74 85.3137 71.3137 88 68 88H32C28.6863 88 26 85.3137 26 82V18Z" 
        fill="url(#paperGrad)" 
        stroke="#1E293B" 
        stroke-width="2.5" />
        
  <!-- Folded Corner Flap -->
  <path d="M58 12V25C58 26.6569 59.3431 28 61 28H74" 
        fill="none" 
        stroke="#1E293B" 
        stroke-width="2.5" 
        stroke-linejoin="round" />

  <!-- Document Fill Lines (Minimalista) -->
  <line x1="36" y1="36" x2="52" y2="36" stroke="#334155" stroke-width="2.5" stroke-linecap="round" />
  <line x1="36" y1="46" x2="64" y2="46" stroke="#334155" stroke-width="2.5" stroke-linecap="round" />

  <!-- Signature Checkmark to Flow Cursor (Brand Element) -->
  <path d="M34 60L46 72L78 38" 
        stroke="url(#brandGrad)" 
        stroke-width="5" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
        filter="url(#cyanGlow)" />

  <!-- Pointer Cursor Tip on Checkmark End -->
  <polygon points="78,38 78,48 70,44" fill="#00D2FF" />
</svg>
